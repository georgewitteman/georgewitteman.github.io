<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>iCloud Private Relay check</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        line-height: 1.5;
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      /* Form controls default to a smaller font. Match the page instead,
         which also stops iOS Safari zooming in on focus (it zooms below 16px). */
      input,
      button {
        font: inherit;
      }
      .result {
        font-weight: bold;
      }
      .yes {
        color: green;
      }
      .no,
      .err {
        color: firebrick;
      }
    </style>
  </head>
  <body>
    <p><a href="../">&larr; Home</a></p>
    <h1>iCloud Private Relay check</h1>

    <h2>IPv4</h2>
    <p>Your IP: <code id="ip-v4">looking up...</code></p>
    <p>Hostname: <code id="host-v4">looking up...</code></p>
    <p class="result" id="result-v4"></p>
    <p id="location-v4"></p>

    <h2>IPv6</h2>
    <p>Your IP: <code id="ip-v6">looking up...</code></p>
    <p>Hostname: <code id="host-v6">looking up...</code></p>
    <p class="result" id="result-v6"></p>
    <p id="location-v6"></p>

    <h2>Check another IP</h2>
    <form id="manual-form">
      <input id="manual-ip" aria-label="IP address" placeholder="e.g. 172.224.224.1" autocomplete="off">
      <button>Check</button>
    </form>
    <p class="result" id="result-manual"></p>
    <p id="location-manual"></p>

    <p><small id="meta"></small></p>

    <script>
      const BITS = { 4: 32, 6: 128 };

      // Returns { version: 4 | 6, value: BigInt }, or null.
      function parseIp(text) {
        const ipv4 = parseIpv4(text);
        if (ipv4 !== null) {
          return { version: 4, value: ipv4 };
        }

        const ipv6 = parseIpv6(text);
        if (ipv6 !== null) {
          return { version: 6, value: ipv6 };
        }

        return null;
      }

      function parseIpv4(text) {
        const parts = text.split(".");
        if (parts.length !== 4) {
          return null;
        }

        // Plain numbers are much faster than BigInt, and 32 bits fit exactly.
        let value = 0;
        for (const part of parts) {
          if (!/^\d{1,3}$/.test(part) || Number(part) > 255) {
            return null;
          }
          value = value * 256 + Number(part);
        }
        return BigInt(value);
      }

      function parseIpv6(text) {
        // Drop a zone ID, e.g. "fe80::1%eth0".
        let address = text.split("%")[0];

        // Turn an embedded IPv4 tail, e.g. "::ffff:1.2.3.4", into two hex groups.
        if (address.includes(".")) {
          const lastColon = address.lastIndexOf(":");
          const ipv4 = parseIpv4(address.slice(lastColon + 1));
          if (ipv4 === null) {
            return null;
          }
          const high = (ipv4 >> 16n).toString(16);
          const low = (ipv4 & 0xffffn).toString(16);
          address = `${address.slice(0, lastColon + 1)}${high}:${low}`;
        }

        // "::" stands for one or more groups of zeros.
        const halves = address.split("::");
        if (halves.length > 2) {
          return null;
        }

        let groups = splitGroups(halves[0]);
        if (halves.length === 2) {
          const tail = splitGroups(halves[1]);
          const missing = 8 - groups.length - tail.length;
          if (missing < 1) {
            return null;
          }
          groups = [...groups, ...Array(missing).fill("0"), ...tail];
        }

        if (groups.length !== 8) {
          return null;
        }

        // Building one BigInt from a hex string is much faster than eight
        // BigInt shifts.
        let hex = "";
        for (const group of groups) {
          if (!/^[0-9a-fA-F]{1,4}$/.test(group)) {
            return null;
          }
          hex += group.padStart(4, "0");
        }
        return BigInt(`0x${hex}`);
      }

      function splitGroups(text) {
        if (text === "") {
          return [];
        }
        return text.split(":");
      }

      // How long to work before pausing so the browser can repaint and
      // handle input.
      const WORK_BUDGET_MS = 20;

      let linesPromise = null;
      // Ranges parsed so far, in file order.
      const parsedRanges = [];
      // Index of the first line that hasn't been parsed yet.
      let nextLine = 0;

      // Returns the first range containing `ip`, or null if none does.
      //
      // Parsing every line up front would freeze the page, so lines are
      // parsed only as checks need them, a little at a time with pauses so
      // the page stays responsive. A check stops at its first match. Parsed
      // ranges are kept and shared, so no line is ever parsed twice.
      async function findRange(ip) {
        const lines = await loadLines();
        // Checks started together would otherwise all run before the first
        // repaint.
        await pause();

        let index = 0;
        let steps = 0;
        let deadline = performance.now() + WORK_BUDGET_MS;

        while (index < parsedRanges.length || nextLine < lines.length) {
          // Check ranges that are already parsed (by this check or another
          // one running at the same time) before parsing more.
          if (index < parsedRanges.length) {
            const range = parsedRanges[index];
            index++;
            if (rangeContains(range, ip)) {
              return range;
            }
          } else {
            const range = parseRangeLine(lines[nextLine]);
            nextLine++;
            if (range !== null) {
              parsedRanges.push(range);
            }
          }

          // Reading the clock on every step would slow the loop down.
          steps++;
          if (steps % 1000 === 0 && performance.now() >= deadline) {
            await pause();
            deadline = performance.now() + WORK_BUDGET_MS;
          }
        }

        return null;
      }

      // setTimeout with no delay lets the browser repaint and handle input
      // before the next step.
      function pause() {
        return new Promise((resolve) => setTimeout(resolve));
      }

      // Fetches once and shares the result. A failed fetch is forgotten so
      // the next check tries again instead of repeating the same error.
      async function loadLines() {
        // `??=` assigns only when linesPromise is null.
        linesPromise ??= fetchLines();
        try {
          return await linesPromise;
        } catch (error) {
          linesPromise = null;
          throw error;
        }
      }

      async function fetchLines() {
        const response = await fetch("ranges.csv");
        if (!response.ok) {
          throw new Error("Could not load ranges.csv");
        }

        const text = (await response.text()).trim();
        if (text === "") {
          throw new Error('ranges.csv is empty. Run the "Update ranges" workflow first.');
        }

        const lines = text.split("\n");
        const meta = document.getElementById("meta");
        meta.textContent = `Checked against ${lines.length.toLocaleString()} ranges from Apple.`;
        // Not awaited: the date is extra, so it mustn't slow down or break the check.
        showDataDate(meta);
        return lines;
      }

      // ranges-updated.txt holds the date (YYYY-MM-DD) ranges.csv was last
      // refreshed. An old date means the automatic updates have stopped. If
      // the file is missing or unreadable, the date is just left out.
      const STALE_AFTER_DAYS = 30;
      const DAY_MS = 24 * 60 * 60 * 1000;

      async function showDataDate(meta) {
        let dateText;
        try {
          const response = await fetch("ranges-updated.txt");
          if (!response.ok) {
            return;
          }
          dateText = (await response.text()).trim();
        } catch {
          return;
        }
        if (!/^\d{4}-\d{2}-\d{2}$/.test(dateText)) {
          return;
        }
        // Read and shown as UTC, so the date doesn't shift with the
        // visitor's time zone.
        const updated = new Date(dateText + "T00:00:00Z");
        if (Number.isNaN(updated.getTime())) {
          return;
        }

        const shownDate = updated.toLocaleDateString(undefined, {
          year: "numeric",
          month: "short",
          day: "numeric",
          timeZone: "UTC",
        });
        meta.append(` Last refreshed ${shownDate}.`);
        if ((Date.now() - updated.getTime()) / DAY_MS > STALE_AFTER_DAYS) {
          meta.append(" Automatic updates may have stopped, so results may be out of date.");
        }
      }

      // Each line is a CIDR, country code, region code, city, and postal
      // code, e.g. 172.224.226.0/27,GB,GB-EN,London,
      // Returns null for blank lines, comments, and lines that don't parse.
      function parseRangeLine(rawLine) {
        const line = rawLine.trim();
        if (line === "" || line.startsWith("#")) {
          return null;
        }

        const [cidr, country, region, city] = parseCsvLine(line);
        const [address, prefixText] = cidr.split("/");
        const network = parseIp(address);
        if (network === null) {
          return null;
        }

        // Skip lines with a missing or impossible prefix, e.g. "/" or "/40" on IPv4.
        const prefixLength = Number(prefixText);
        if (!/^\d{1,3}$/.test(prefixText) || prefixLength > BITS[network.version]) {
          return null;
        }

        return {
          cidr,
          network,
          prefixLength,
          city,
          region,
          country,
        };
      }

      // Splits one CSV line into fields. Handles quoted fields such as
      // "Washington, D.C." and doubled quotes ("") inside them.
      function parseCsvLine(line) {
        // Fast path: almost every line has no quotes.
        if (!line.includes('"')) {
          return line.split(",");
        }

        const fields = [];
        let field = "";
        let inQuotes = false;

        for (let i = 0; i < line.length; i++) {
          const char = line[i];

          if (inQuotes && char === '"' && line[i + 1] === '"') {
            field += '"';
            i++;
          } else if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === "," && !inQuotes) {
            fields.push(field);
            field = "";
          } else {
            field += char;
          }
        }

        fields.push(field);
        return fields;
      }

      function rangeContains(range, ip) {
        if (range.network.version !== ip.version) {
          return false;
        }

        // Compare only the network bits by shifting off the host bits.
        const hostBits = BigInt(BITS[ip.version] - range.prefixLength);
        return range.network.value >> hostBits === ip.value >> hostBits;
      }

      // Formats as "Los Angeles, CA, United States".
      function formatLocation(range) {
        const parts = [range.city, formatRegion(range.region), formatCountry(range.country)];
        return parts.filter(Boolean).join(", ") || "unknown";
      }

      // Region codes look like "US-CA". Browsers have no built-in names for
      // them, so show the part after the dash.
      function formatRegion(region) {
        if (!region) {
          return "";
        }
        return region.split("-").pop();
      }

      // Country codes look like "US". Intl.DisplayNames gives the name in
      // the visitor's language, and its of() throws for codes it doesn't
      // accept, so fall back to the raw code.
      const countryNames = new Intl.DisplayNames(undefined, { type: "region" });

      function formatCountry(country) {
        try {
          return countryNames.of(country);
        } catch {
          return country;
        }
      }

      // Each section ("v4", "v6", "manual") has elements named
      // result-<section> and location-<section>.
      function showResult(section, status, message, location = "") {
        const result = document.getElementById(`result-${section}`);
        result.className = `result ${status}`;
        result.textContent = message;
        document.getElementById(`location-${section}`).textContent = location;
      }

      async function checkIp(section, text) {
        showResult(section, "", "Checking...");

        const ip = parseIp(text);
        if (ip === null) {
          showResult(section, "err", "That is not a valid IP address.");
          return;
        }

        let match;
        try {
          match = await findRange(ip);
        } catch (error) {
          showResult(section, "err", error.message);
          return;
        }

        if (match === null) {
          showResult(section, "no", `No. ${text} is not in the iCloud Private Relay list.`);
          return;
        }

        showResult(
          section,
          "yes",
          `Yes. ${text} is an iCloud Private Relay address (${match.cidr}).`,
          `Relay location: ${formatLocation(match)}`
        );
      }

      // Reverse DNS: the hostname for an IP is the PTR record of a name
      // built from the IP backwards, e.g. 192.0.2.1 is looked up as
      // 1.2.0.192.in-addr.arpa, and IPv6 as one hex digit per label under
      // ip6.arpa.
      function reverseName(ip) {
        if (ip.version === 4) {
          const octets = [];
          for (let i = 0; i < 4; i++) {
            octets.push(((ip.value >> BigInt(i * 8)) & 0xffn).toString());
          }
          return `${octets.join(".")}.in-addr.arpa`;
        }

        const digits = ip.value.toString(16).padStart(32, "0").split("").reverse();
        return `${digits.join(".")}.ip6.arpa`;
      }

      // Uses Cloudflare's DNS-over-HTTPS JSON API. The answer looks like
      // { "Status": 0, "Answer": [{ "type": 12, "data": "host.example.com." }] },
      // where Status is the DNS response code (0 is success, 3 is "no such
      // name") and type 12 is PTR. Other answer types, such as a CNAME the
      // lookup passed through, are skipped.
      async function showHostname(section, ip) {
        const hostElement = document.getElementById(`host-${section}`);
        const url = `https://cloudflare-dns.com/dns-query?name=${reverseName(ip)}&type=PTR`;

        let answer;
        try {
          const response = await fetch(url, { headers: { accept: "application/dns-json" } });
          if (!response.ok) {
            throw new Error("HTTP error " + response.status);
          }
          answer = await response.json();
        } catch {
          hostElement.textContent = "couldn't look up";
          return;
        }

        if (answer.Status !== 0 && answer.Status !== 3) {
          hostElement.textContent = "couldn't look up";
          return;
        }

        // `?? []` stands in an empty list when there's no Answer, and
        // /\.$/ drops the trailing dot DNS puts on full names.
        const hostnames = (answer.Answer ?? [])
          .filter((record) => record.type === 12 && typeof record.data === "string")
          .map((record) => record.data.replace(/\.$/, ""));
        hostElement.textContent = hostnames.join(", ") || "none";
      }

      // ipv4.icanhazip.com only answers over IPv4, ipv6.icanhazip.com only
      // over IPv6, each with the address as plain text. A failed lookup can
      // mean the network lacks that IP version or that icanhazip is down,
      // and there's no way to tell which.
      async function checkMyIp(section, url, missingMessage) {
        const ipElement = document.getElementById(`ip-${section}`);
        const hostElement = document.getElementById(`host-${section}`);

        let ip;
        try {
          const response = await fetch(url);
          if (!response.ok) {
            throw new Error("HTTP error " + response.status);
          }
          ip = (await response.text()).trim();
          if (parseIp(ip) === null) {
            throw new Error("No IP in the response");
          }
        } catch {
          ipElement.textContent = "unknown";
          hostElement.textContent = "unknown";
          showResult(section, "none", missingMessage);
          return;
        }

        ipElement.textContent = ip;
        // Not awaited, so the relay check doesn't wait on the hostname.
        showHostname(section, parseIp(ip));
        await checkIp(section, ip);
      }

      document.getElementById("manual-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const text = document.getElementById("manual-ip").value.trim();
        if (text !== "") {
          checkIp("manual", text);
        }
      });

      checkMyIp(
        "v4",
        "https://ipv4.icanhazip.com",
        "Couldn't look up your IPv4 address. You can still check an IP below."
      );
      checkMyIp(
        "v6",
        "https://ipv6.icanhazip.com",
        "Couldn't look up your IPv6 address. Your network may not support IPv6, or the lookup service may be down."
      );
    </script>
  </body>
</html>
