<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>iCloud Private Relay check</title>
    <style>
      body {
        font:
          16px/1.5 system-ui,
          sans-serif;
        max-width: 40rem;
        margin: 3rem auto;
        padding: 0 1rem;
      }
      code {
        background: #8882;
        padding: 0.1em 0.3em;
        border-radius: 3px;
      }
      input {
        font: inherit;
        padding: 0.3rem;
        width: 16rem;
        max-width: 100%;
      }
      button {
        font: inherit;
        padding: 0.3rem 0.8rem;
      }
      .result {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0.25rem 0 1rem;
      }
      .no {
        color: #b45309;
      }
      .yes {
        color: #15803d;
      }
      .err {
        color: #b91c1c;
      }
      .none {
        color: #666;
      }
      .loc {
        margin-top: -0.75rem;
      }
      .loc:empty {
        display: none;
      }
      small {
        color: #666;
      }
    </style>
  </head>
  <body>
    <p><a href="./">&larr; Home</a></p>
    <h1>iCloud Private Relay check</h1>

    <h2>IPv4</h2>
    <p>Your IP: <code id="ip4">looking up...</code></p>
    <div class="result" id="result4"></div>
    <p class="loc" id="loc4"></p>

    <h2>IPv6</h2>
    <p>Your IP: <code id="ip6">looking up...</code></p>
    <div class="result" id="result6"></div>
    <p class="loc" id="loc6"></p>

    <h2>Check another IP</h2>
    <form id="form">
      <input id="manual" placeholder="e.g. 172.224.224.1" autocomplete="off" />
      <button>Check</button>
    </form>
    <div class="result" id="result-manual"></div>
    <p class="loc" id="loc-manual"></p>

    <p><small id="meta"></small></p>

    <script>
      // Plain ES5 on purpose so this works in older browsers.
      // No fetch, Promise, BigInt, arrow functions, or template literals.
      function $(id) {
        return document.getElementById(id);
      }

      // --- IP parsing ---
      // IPv4 -> number. IPv6 -> array of 8 16-bit numbers. Invalid -> null.
      function parseV4(s) {
        var p = s.split(".");
        if (p.length !== 4) return null;
        var n = 0;
        for (var i = 0; i < 4; i++) {
          if (!/^\d{1,3}$/.test(p[i]) || +p[i] > 255) return null;
          n = n * 256 + +p[i];
        }
        return n;
      }

      function parseV6(s) {
        s = s.split("%")[0];
        if (s.indexOf(".") !== -1) {
          // embedded IPv4, e.g. ::ffff:1.2.3.4
          var c = s.lastIndexOf(":");
          var v4 = parseV4(s.slice(c + 1));
          if (v4 === null) return null;
          s =
            s.slice(0, c + 1) +
            Math.floor(v4 / 65536).toString(16) +
            ":" +
            (v4 % 65536).toString(16);
        }
        var halves = s.split("::");
        if (halves.length > 2) return null;
        var head = halves[0] ? halves[0].split(":") : [];
        var tail = halves.length === 2 && halves[1] ? halves[1].split(":") : [];
        var groups = head;
        if (halves.length === 2) {
          var fill = 8 - head.length - tail.length;
          if (fill < 1) return null;
          groups = head.slice();
          for (var f = 0; f < fill; f++) groups.push("0");
          groups = groups.concat(tail);
        }
        if (groups.length !== 8) return null;
        var out = [];
        for (var i = 0; i < 8; i++) {
          if (!/^[0-9a-fA-F]{1,4}$/.test(groups[i])) return null;
          out.push(parseInt(groups[i], 16));
        }
        return out;
      }

      function sameV6Prefix(a, b, len) {
        for (var i = 0; i < 8 && len > 0; i++, len -= 16) {
          var bits = len >= 16 ? 16 : len;
          var shift = Math.pow(2, 16 - bits);
          if (Math.floor(a[i] / shift) !== Math.floor(b[i] / shift))
            return false;
        }
        return true;
      }

      // --- Load ranges ---
      // ranges.csv lines look like: 172.224.226.0/27,GB,GB-EN,London
      var ranges = null;
      var rangesError = null;
      var waiting = null;

      function loadRanges(cb) {
        if (ranges || rangesError) return cb(rangesError, ranges);
        if (waiting) return waiting.push(cb);
        waiting = [cb];
        var xhr = new XMLHttpRequest();
        xhr.open("GET", "ranges.csv?" + new Date().getTime());
        xhr.onreadystatechange = function () {
          if (xhr.readyState !== 4) return;
          if (xhr.status === 200) {
            ranges = parseRanges(xhr.responseText);
            if (!ranges.length)
              rangesError = new Error(
                'ranges.csv is empty. Run the "Update ranges" workflow first.'
              );
            else
              $("meta").textContent =
                "Checked against " +
                ranges.length.toLocaleString() +
                " ranges from Apple.";
          } else {
            rangesError = new Error("Could not load ranges.csv");
          }
          var list = waiting;
          waiting = null;
          for (var i = 0; i < list.length; i++) list[i](rangesError, ranges);
        };
        xhr.send();
      }

      function parseRanges(text) {
        var lines = text.split("\n");
        var out = [];
        for (var i = 0; i < lines.length; i++) {
          var line = lines[i].replace(/^\s+|\s+$/g, "");
          if (!line || line.charAt(0) === "#") continue;
          var cols = line.split(",");
          var parts = cols[0].split("/");
          var isV6 = parts[0].indexOf(":") !== -1;
          var net = isV6 ? parseV6(parts[0]) : parseV4(parts[0]);
          if (net === null) continue;
          out.push({
            cidr: cols[0],
            v6: isV6,
            net: net,
            len: +parts[1],
            location: formatLocation(cols[3], cols[2], cols[1]),
          });
        }
        return out;
      }

      function formatLocation(city, region, country) {
        var parts = [];
        if (city) parts.push(city);
        if (region) parts.push(region);
        if (country && country !== region) parts.push(country);
        return parts.join(", ");
      }

      // --- Range check ---
      function findMatch(ip, list) {
        var v4 = parseV4(ip);
        var v6 = v4 === null ? parseV6(ip) : null;
        if (v4 === null && v6 === null) return undefined; // invalid IP
        for (var i = 0; i < list.length; i++) {
          var r = list[i];
          if (v4 !== null) {
            if (r.v6) continue;
            var shift = Math.pow(2, 32 - r.len);
            if (Math.floor(r.net / shift) === Math.floor(v4 / shift)) return r;
          } else {
            if (!r.v6) continue;
            if (sameV6Prefix(r.net, v6, r.len)) return r;
          }
        }
        return null;
      }

      function show(out, className, text) {
        out.className = "result " + className;
        out.textContent = text;
      }

      function check(ip, out, locEl) {
        show(out, "", "Checking...");
        if (locEl) locEl.textContent = "";
        loadRanges(function (err, list) {
          if (err) return show(out, "err", err.message);
          var match = findMatch(ip, list);
          if (match === undefined) {
            show(out, "err", "That is not a valid IP address.");
          } else if (match) {
            show(
              out,
              "yes",
              "Yes. " +
                ip +
                " is an iCloud Private Relay address (" +
                match.cidr +
                ")."
            );
            if (locEl)
              locEl.textContent =
                "Relay location: " + (match.location || "unknown");
          } else {
            show(
              out,
              "no",
              "No. " + ip + " is not in the iCloud Private Relay list."
            );
          }
        });
      }

      // --- Look up my own IPv4 and IPv6 ---
      // api.ipify.org only answers over IPv4. api6.ipify.org only over IPv6.
      function lookupMine(url, ipEl, out, locEl, missingText) {
        function missing() {
          ipEl.textContent = "none";
          show(out, "none", missingText);
        }
        var xhr = new XMLHttpRequest();
        try {
          xhr.open("GET", url);
        } catch (e) {
          return missing();
        }
        xhr.onreadystatechange = function () {
          if (xhr.readyState !== 4) return;
          var ip = null;
          try {
            ip = JSON.parse(xhr.responseText).ip;
          } catch (e) {}
          if (xhr.status !== 200 || !ip) return missing();
          ipEl.textContent = ip;
          check(ip, out, locEl);
        };
        xhr.send();
      }

      // --- Wire up ---
      $("form").onsubmit = function (e) {
        if (e && e.preventDefault) e.preventDefault();
        var v = $("manual").value.replace(/^\s+|\s+$/g, "");
        if (v) check(v, $("result-manual"), $("loc-manual"));
        return false;
      };

      lookupMine(
        "https://api.ipify.org?format=json",
        $("ip4"),
        $("result4"),
        $("loc4"),
        "No IPv4 address found."
      );
      lookupMine(
        "https://api6.ipify.org?format=json",
        $("ip6"),
        $("result6"),
        $("loc6"),
        "No IPv6 address found. Your network may not support IPv6."
      );
    </script>
  </body>
</html>
