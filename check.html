<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>iCloud Private Relay check</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        line-height: 1.5;
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      /* iOS Safari zooms in when focusing inputs smaller than 16px. */
      input {
        font-size: 16px;
      }
      .result {
        font-weight: bold;
      }
      .yes {
        color: green;
      }
      .no,
      .err {
        color: firebrick;
      }
    </style>
  </head>
  <body>
    <p><a href="./">&larr; Home</a></p>
    <h1>iCloud Private Relay check</h1>

    <h2>IPv4</h2>
    <p>Your IP: <code id="ip-v4">looking up...</code></p>
    <p class="result" id="result-v4"></p>
    <p id="location-v4"></p>

    <h2>IPv6</h2>
    <p>Your IP: <code id="ip-v6">looking up...</code></p>
    <p class="result" id="result-v6"></p>
    <p id="location-v6"></p>

    <h2>Check another IP</h2>
    <form id="manual-form">
      <input id="manual-ip" placeholder="e.g. 172.224.224.1" autocomplete="off" />
      <button>Check</button>
    </form>
    <p class="result" id="result-manual"></p>
    <p id="location-manual"></p>

    <p><small id="meta"></small></p>

    <script>
      // ---------------------------------------------------------------
      // Parsing IP addresses
      //
      // An IP is represented as { version: 4 | 6, value: BigInt }.
      // ---------------------------------------------------------------

      const BITS = { 4: 32, 6: 128 };

      function parseIp(text) {
        const ipv4 = parseIpv4(text);
        if (ipv4 !== null) {
          return { version: 4, value: ipv4 };
        }

        const ipv6 = parseIpv6(text);
        if (ipv6 !== null) {
          return { version: 6, value: ipv6 };
        }

        return null;
      }

      function parseIpv4(text) {
        const parts = text.split(".");
        if (parts.length !== 4) {
          return null;
        }

        let value = 0n;
        for (const part of parts) {
          if (!/^\d{1,3}$/.test(part) || Number(part) > 255) {
            return null;
          }
          value = (value << 8n) | BigInt(part);
        }
        return value;
      }

      function parseIpv6(text) {
        // Drop a zone ID, e.g. "fe80::1%eth0".
        let address = text.split("%")[0];

        // Turn an embedded IPv4 tail, e.g. "::ffff:1.2.3.4", into two hex groups.
        if (address.includes(".")) {
          const lastColon = address.lastIndexOf(":");
          const ipv4 = parseIpv4(address.slice(lastColon + 1));
          if (ipv4 === null) {
            return null;
          }
          const high = (ipv4 >> 16n).toString(16);
          const low = (ipv4 & 0xffffn).toString(16);
          address = `${address.slice(0, lastColon + 1)}${high}:${low}`;
        }

        // "::" stands for one or more groups of zeros.
        const halves = address.split("::");
        if (halves.length > 2) {
          return null;
        }

        let groups = splitGroups(halves[0]);
        if (halves.length === 2) {
          const tail = splitGroups(halves[1]);
          const missing = 8 - groups.length - tail.length;
          if (missing < 1) {
            return null;
          }
          groups = [...groups, ...Array(missing).fill("0"), ...tail];
        }

        if (groups.length !== 8) {
          return null;
        }

        let value = 0n;
        for (const group of groups) {
          if (!/^[0-9a-fA-F]{1,4}$/.test(group)) {
            return null;
          }
          value = (value << 16n) | BigInt(`0x${group}`);
        }
        return value;
      }

      function splitGroups(text) {
        if (text === "") {
          return [];
        }
        return text.split(":");
      }

      // ---------------------------------------------------------------
      // Loading Apple's ranges
      //
      // Each line of ranges.csv looks like: 172.224.226.0/27,GB,GB-EN,London
      // ---------------------------------------------------------------

      let rangesPromise = null;

      function loadRanges() {
        rangesPromise ??= fetchRanges();
        return rangesPromise;
      }

      async function fetchRanges() {
        const response = await fetch("ranges.csv");
        if (!response.ok) {
          throw new Error("Could not load ranges.csv");
        }

        const ranges = parseRanges(await response.text());
        if (ranges.length === 0) {
          throw new Error('ranges.csv is empty. Run the "Update ranges" workflow first.');
        }

        const count = ranges.length.toLocaleString();
        document.getElementById("meta").textContent = `Checked against ${count} ranges from Apple.`;
        return ranges;
      }

      function parseRanges(text) {
        const ranges = [];

        for (const rawLine of text.split("\n")) {
          const line = rawLine.trim();
          if (line === "" || line.startsWith("#")) {
            continue;
          }

          const [cidr, country, region, city] = parseCsvLine(line);
          const [address, prefixText] = cidr.split("/");
          const network = parseIp(address);
          if (network === null) {
            continue;
          }

          // Skip lines with a missing or impossible prefix, e.g. "/" or "/40" on IPv4.
          const prefixLength = Number(prefixText);
          if (!/^\d{1,3}$/.test(prefixText) || prefixLength > BITS[network.version]) {
            continue;
          }

          ranges.push({
            cidr,
            network,
            prefixLength,
            city,
            region,
            country,
          });
        }

        return ranges;
      }

      // Splits one CSV line into fields. Handles quoted fields such as
      // "Washington, D.C." and doubled quotes ("") inside them.
      function parseCsvLine(line) {
        // Fast path: almost every line has no quotes.
        if (!line.includes('"')) {
          return line.split(",");
        }

        const fields = [];
        let field = "";
        let inQuotes = false;

        for (let i = 0; i < line.length; i++) {
          const char = line[i];

          if (inQuotes && char === '"' && line[i + 1] === '"') {
            field += '"';
            i++;
          } else if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === "," && !inQuotes) {
            fields.push(field);
            field = "";
          } else {
            field += char;
          }
        }

        fields.push(field);
        return fields;
      }

      function rangeContains(range, ip) {
        if (range.network.version !== ip.version) {
          return false;
        }

        // Compare only the network bits by shifting off the host bits.
        const hostBits = BigInt(BITS[ip.version] - range.prefixLength);
        return range.network.value >> hostBits === ip.value >> hostBits;
      }

      // Formats as "Los Angeles, CA, United States".
      function formatLocation(range) {
        const parts = [range.city, formatRegion(range.region), formatCountry(range.country)];
        return parts.filter(Boolean).join(", ") || "unknown";
      }

      // Region codes look like "US-CA". Browsers have no built-in names for
      // them, so show the part after the dash.
      function formatRegion(region) {
        if (!region) {
          return "";
        }
        return region.split("-").pop();
      }

      // Country codes look like "US". Show the name in the visitor's language,
      // falling back to the raw code.
      const countryNames = new Intl.DisplayNames(undefined, { type: "region" });

      function formatCountry(country) {
        try {
          return countryNames.of(country);
        } catch {
          return country;
        }
      }

      // ---------------------------------------------------------------
      // Showing results
      //
      // Each section ("v4", "v6", "manual") has elements named
      // result-<section> and location-<section>.
      // ---------------------------------------------------------------

      function showResult(section, status, message, location = "") {
        const result = document.getElementById(`result-${section}`);
        result.className = `result ${status}`;
        result.textContent = message;
        document.getElementById(`location-${section}`).textContent = location;
      }

      async function checkIp(section, text) {
        showResult(section, "", "Checking...");

        const ip = parseIp(text);
        if (ip === null) {
          showResult(section, "err", "That is not a valid IP address.");
          return;
        }

        let ranges;
        try {
          ranges = await loadRanges();
        } catch (error) {
          showResult(section, "err", error.message);
          return;
        }

        const match = ranges.find((range) => rangeContains(range, ip));
        if (!match) {
          showResult(section, "no", `No. ${text} is not in the iCloud Private Relay list.`);
          return;
        }

        showResult(
          section,
          "yes",
          `Yes. ${text} is an iCloud Private Relay address (${match.cidr}).`,
          `Relay location: ${formatLocation(match)}`
        );
      }

      // api.ipify.org only answers over IPv4. api6.ipify.org only over IPv6.
      async function checkMyIp(section, url, missingMessage) {
        const ipElement = document.getElementById(`ip-${section}`);

        let ip;
        try {
          const response = await fetch(url);
          ip = (await response.json()).ip;
        } catch {
          ipElement.textContent = "none";
          showResult(section, "none", missingMessage);
          return;
        }

        ipElement.textContent = ip;
        await checkIp(section, ip);
      }

      // ---------------------------------------------------------------
      // Start
      // ---------------------------------------------------------------

      document.getElementById("manual-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const text = document.getElementById("manual-ip").value.trim();
        if (text !== "") {
          checkIp("manual", text);
        }
      });

      checkMyIp("v4", "https://api.ipify.org?format=json", "No IPv4 address found.");
      checkMyIp(
        "v6",
        "https://api6.ipify.org?format=json",
        "No IPv6 address found. Your network may not support IPv6."
      );
    </script>
  </body>
</html>
