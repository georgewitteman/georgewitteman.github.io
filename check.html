<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>iCloud Private Relay check</title>
    <style>
      body {
        font:
          16px/1.5 system-ui,
          sans-serif;
        max-width: 40rem;
        margin: 3rem auto;
        padding: 0 1rem;
      }
      code {
        background: #8882;
        padding: 0.1em 0.3em;
        border-radius: 3px;
      }
      input {
        font: inherit;
        padding: 0.3rem;
        width: 16rem;
        max-width: 100%;
      }
      button {
        font: inherit;
        padding: 0.3rem 0.8rem;
      }
      .result {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0.25rem 0 1rem;
      }
      .no {
        color: #b45309;
      }
      .yes {
        color: #15803d;
      }
      .err {
        color: #b91c1c;
      }
      .none {
        color: #666;
      }
      small {
        color: #666;
      }
    </style>
  </head>
  <body>
    <p><a href="./">&larr; Home</a></p>
    <h1>iCloud Private Relay check</h1>

    <h2>IPv4</h2>
    <p>Your IP: <code id="ip4">looking up...</code></p>
    <div class="result" id="result4"></div>

    <h2>IPv6</h2>
    <p>Your IP: <code id="ip6">looking up...</code></p>
    <div class="result" id="result6"></div>

    <h2>Check another IP</h2>
    <form id="form">
      <input id="manual" placeholder="e.g. 172.224.224.1" autocomplete="off" />
      <button>Check</button>
    </form>
    <div class="result" id="result-manual"></div>

    <p><small id="meta"></small></p>

    <script>
      const $ = (id) => document.getElementById(id);

      // --- IP parsing ---
      function parseV4(s) {
        const p = s.split(".");
        if (p.length !== 4) return null;
        let n = 0;
        for (const x of p) {
          if (!/^\d{1,3}$/.test(x) || +x > 255) return null;
          n = n * 256 + +x;
        }
        return n;
      }

      function parseV6(s) {
        s = s.split("%")[0];
        if (s.includes(".")) {
          // embedded IPv4, e.g. ::ffff:1.2.3.4
          const i = s.lastIndexOf(":");
          const v4 = parseV4(s.slice(i + 1));
          if (v4 === null) return null;
          s =
            s.slice(0, i + 1) +
            Math.floor(v4 / 65536).toString(16) +
            ":" +
            (v4 % 65536).toString(16);
        }
        const halves = s.split("::");
        if (halves.length > 2) return null;
        const head = halves[0] ? halves[0].split(":") : [];
        const tail =
          halves.length === 2 && halves[1] ? halves[1].split(":") : [];
        let groups = head;
        if (halves.length === 2) {
          const fill = 8 - head.length - tail.length;
          if (fill < 1) return null;
          groups = [...head, ...Array(fill).fill("0"), ...tail];
        }
        if (groups.length !== 8) return null;
        let n = 0n;
        for (const g of groups) {
          if (!/^[0-9a-fA-F]{1,4}$/.test(g)) return null;
          n = (n << 16n) | BigInt("0x" + g);
        }
        return n;
      }

      // --- Range check ---
      let rangesPromise = null;
      function loadRanges() {
        rangesPromise ??= fetchRanges();
        return rangesPromise;
      }

      async function fetchRanges() {
        const res = await fetch("cidrs.txt", { cache: "no-cache" });
        if (!res.ok) throw new Error("Could not load cidrs.txt");
        const ranges = (await res.text())
          .split("\n")
          .map((l) => l.trim())
          .filter((l) => l && !l.startsWith("#"));
        if (!ranges.length)
          throw new Error(
            'cidrs.txt is empty. Run the "Update ranges" workflow first.',
          );
        const count = ranges.length.toLocaleString();
        $("meta").textContent = `Checked against ${count} ranges from Apple.`;
        return ranges;
      }

      function findMatch(ip, list) {
        const v4 = parseV4(ip);
        const v6 = v4 === null ? parseV6(ip) : null;
        if (v4 === null && v6 === null) return undefined; // invalid IP
        for (const cidr of list) {
          const [net, lenStr] = cidr.split("/");
          const len = +lenStr;
          if (v4 !== null) {
            if (net.includes(":")) continue;
            const shift = 2 ** (32 - len);
            if (Math.floor(parseV4(net) / shift) === Math.floor(v4 / shift))
              return cidr;
          } else {
            if (!net.includes(":")) continue;
            const shift = BigInt(128 - len);
            if (parseV6(net) >> shift === v6 >> shift) return cidr;
          }
        }
        return null;
      }

      function show(out, className, text) {
        out.className = "result " + className;
        out.textContent = text;
      }

      async function check(ip, out) {
        show(out, "", "Checking...");
        try {
          const match = findMatch(ip, await loadRanges());
          if (match === undefined) {
            show(out, "err", "That is not a valid IP address.");
          } else if (match) {
            show(
              out,
              "yes",
              `Yes. ${ip} is an iCloud Private Relay address (${match}).`,
            );
          } else {
            show(
              out,
              "no",
              `No. ${ip} is not in the iCloud Private Relay list.`,
            );
          }
        } catch (e) {
          show(out, "err", e.message);
        }
      }

      // --- Look up my own IPv4 and IPv6 ---
      // api.ipify.org only answers over IPv4. api6.ipify.org only over IPv6.
      async function lookupMine(url, ipEl, out, missingText) {
        let ip;
        try {
          const res = await fetch(url);
          ip = (await res.json()).ip;
        } catch {
          ipEl.textContent = "none";
          show(out, "none", missingText);
          return;
        }
        ipEl.textContent = ip;
        await check(ip, out);
      }

      // --- Wire up ---
      $("form").addEventListener("submit", (e) => {
        e.preventDefault();
        const v = $("manual").value.trim();
        if (v) check(v, $("result-manual"));
      });

      lookupMine(
        "https://api.ipify.org?format=json",
        $("ip4"),
        $("result4"),
        "No IPv4 address found.",
      );
      lookupMine(
        "https://api6.ipify.org?format=json",
        $("ip6"),
        $("result6"),
        "No IPv6 address found. Your network may not support IPv6.",
      );
    </script>
  </body>
</html>
