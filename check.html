<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>iCloud Private Relay check</title>
    <style>
      body {
        font:
          16px/1.5 system-ui,
          sans-serif;
        max-width: 40rem;
        margin: 3rem auto;
        padding: 0 1rem;
      }
      code {
        background: #8882;
        padding: 0.1em 0.3em;
        border-radius: 3px;
      }
      input {
        font: inherit;
        padding: 0.3rem;
        width: 16rem;
        max-width: 100%;
      }
      button {
        font: inherit;
        padding: 0.3rem 0.8rem;
      }
      .result {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0.25rem 0 1rem;
      }
      .no {
        color: #b45309;
      }
      .yes {
        color: #15803d;
      }
      .err {
        color: #b91c1c;
      }
      .none {
        color: #666;
      }
      .loc {
        margin-top: -0.75rem;
      }
      .loc:empty {
        display: none;
      }
      small {
        color: #666;
      }
    </style>
  </head>
  <body>
    <p><a href="./">&larr; Home</a></p>
    <h1>iCloud Private Relay check</h1>

    <h2>IPv4</h2>
    <p>Your IP: <code id="ip4">looking up...</code></p>
    <div class="result" id="result4"></div>
    <p class="loc" id="loc4"></p>

    <h2>IPv6</h2>
    <p>Your IP: <code id="ip6">looking up...</code></p>
    <div class="result" id="result6"></div>
    <p class="loc" id="loc6"></p>

    <h2>Check another IP</h2>
    <form id="form">
      <input id="manual" placeholder="e.g. 172.224.224.1" autocomplete="off" />
      <button>Check</button>
    </form>
    <div class="result" id="result-manual"></div>
    <p class="loc" id="loc-manual"></p>

    <p><small id="meta"></small></p>

    <script>
      const $ = (id) => document.getElementById(id);

      // --- IP parsing ---
      // IPv4 -> number. IPv6 -> array of 8 16-bit numbers. Invalid -> null.
      function parseV4(s) {
        const p = s.split(".");
        if (p.length !== 4) return null;
        let n = 0;
        for (const x of p) {
          if (!/^\d{1,3}$/.test(x) || +x > 255) return null;
          n = n * 256 + +x;
        }
        return n;
      }

      function parseV6(s) {
        s = s.split("%")[0];
        if (s.includes(".")) {
          // embedded IPv4, e.g. ::ffff:1.2.3.4
          const i = s.lastIndexOf(":");
          const v4 = parseV4(s.slice(i + 1));
          if (v4 === null) return null;
          s =
            s.slice(0, i + 1) +
            Math.floor(v4 / 65536).toString(16) +
            ":" +
            (v4 % 65536).toString(16);
        }
        const halves = s.split("::");
        if (halves.length > 2) return null;
        const head = halves[0] ? halves[0].split(":") : [];
        const tail = halves.length === 2 && halves[1] ? halves[1].split(":") : [];
        let groups = head;
        if (halves.length === 2) {
          const fill = 8 - head.length - tail.length;
          if (fill < 1) return null;
          groups = [...head, ...Array(fill).fill("0"), ...tail];
        }
        if (groups.length !== 8) return null;
        if (!groups.every((g) => /^[0-9a-fA-F]{1,4}$/.test(g))) return null;
        return groups.map((g) => parseInt(g, 16));
      }

      function sameV6Prefix(a, b, len) {
        for (let i = 0; i < 8 && len > 0; i++, len -= 16) {
          const shift = Math.pow(2, 16 - Math.min(len, 16));
          if (Math.floor(a[i] / shift) !== Math.floor(b[i] / shift))
            return false;
        }
        return true;
      }

      // --- Load ranges ---
      // ranges.csv lines look like: 172.224.226.0/27,GB,GB-EN,London
      let rangesPromise = null;
      function loadRanges() {
        if (!rangesPromise) rangesPromise = fetchRanges();
        return rangesPromise;
      }

      function fetchRanges() {
        return fetch("ranges.csv", { cache: "no-cache" })
          .then((res) => {
            if (!res.ok) throw new Error("Could not load ranges.csv");
            return res.text();
          })
          .then((text) => {
            const ranges = parseRanges(text);
            if (!ranges.length)
              throw new Error(
                'ranges.csv is empty. Run the "Update ranges" workflow first.'
              );
            const count = ranges.length.toLocaleString();
            $("meta").textContent = `Checked against ${count} ranges from Apple.`;
            return ranges;
          });
      }

      function parseRanges(text) {
        const out = [];
        for (const raw of text.split("\n")) {
          const line = raw.trim();
          if (!line || line.startsWith("#")) continue;
          const [cidr, country, , city] = line.split(",");
          const [ip, len] = cidr.split("/");
          const v6 = ip.includes(":");
          const net = v6 ? parseV6(ip) : parseV4(ip);
          if (net === null) continue;
          out.push({
            cidr,
            v6,
            net,
            len: +len,
            city,
            country,
          });
        }
        return out;
      }

      // "London, United Kingdom". Falls back to the raw country code.
      const regionNames = new Intl.DisplayNames(undefined, { type: "region" });
      function formatLocation(city, country) {
        let name = country;
        try {
          name = regionNames.of(country);
        } catch (e) {}
        return [city, name].filter(Boolean).join(", ");
      }

      // --- Range check ---
      function findMatch(ip, list) {
        const v4 = parseV4(ip);
        const v6 = v4 === null ? parseV6(ip) : null;
        if (v4 === null && v6 === null) return undefined; // invalid IP
        for (const r of list) {
          if (v4 !== null) {
            if (r.v6) continue;
            const shift = Math.pow(2, 32 - r.len);
            if (Math.floor(r.net / shift) === Math.floor(v4 / shift)) return r;
          } else {
            if (!r.v6) continue;
            if (sameV6Prefix(r.net, v6, r.len)) return r;
          }
        }
        return null;
      }

      function show(out, className, text) {
        out.className = "result " + className;
        out.textContent = text;
      }

      function check(ip, out, locEl) {
        show(out, "", "Checking...");
        locEl.textContent = "";
        return loadRanges()
          .then((list) => {
            const match = findMatch(ip, list);
            if (match === undefined) {
              show(out, "err", "That is not a valid IP address.");
            } else if (match) {
              show(
                out,
                "yes",
                `Yes. ${ip} is an iCloud Private Relay address (${match.cidr}).`
              );
              locEl.textContent = `Relay location: ${formatLocation(match.city, match.country) || "unknown"}`;
            } else {
              show(out, "no", `No. ${ip} is not in the iCloud Private Relay list.`);
            }
          })
          .catch((e) => show(out, "err", e.message));
      }

      // --- Look up my own IPv4 and IPv6 ---
      // api.ipify.org only answers over IPv4. api6.ipify.org only over IPv6.
      function lookupMine(url, ipEl, out, locEl, missingText) {
        fetch(url)
          .then((res) => res.json())
          .then(
            (data) => {
              ipEl.textContent = data.ip;
              return check(data.ip, out, locEl);
            },
            () => {
              ipEl.textContent = "none";
              show(out, "none", missingText);
            }
          );
      }

      // --- Wire up ---
      $("form").addEventListener("submit", (e) => {
        e.preventDefault();
        const v = $("manual").value.trim();
        if (v) check(v, $("result-manual"), $("loc-manual"));
      });

      lookupMine(
        "https://api.ipify.org?format=json",
        $("ip4"),
        $("result4"),
        $("loc4"),
        "No IPv4 address found."
      );
      lookupMine(
        "https://api6.ipify.org?format=json",
        $("ip6"),
        $("result6"),
        $("loc6"),
        "No IPv6 address found. Your network may not support IPv6."
      );
    </script>
  </body>
</html>
