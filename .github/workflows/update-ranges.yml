name: Update ranges

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download Apple's egress IP list
        run: |
          curl -fsSL https://mask-api.icloud.com/egress-ip-ranges.csv | cut -d, -f1 > cidrs.txt
          test -s cidrs.txt

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cidrs.txt
          git diff --cached --quiet || (git commit -m "Update iCloud Private Relay ranges" && git push)
