name: Update ranges

on:
  schedule:
    # Fields are minute, hour, day of month, month, and day of week, in
    # UTC. A time partway through the hour avoids the busy start of each hour.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # A plain `git clone` rather than actions/checkout, so there's no
      # action version to keep updated. `--depth 1` fetches only the latest
      # commit, and the token in the URL lets `git push` write back.
      - name: Clone the repository
        env:
          TOKEN: ${{ github.token }}
        run: git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .

      # Check the download before replacing the old file, so if Apple moves
      # or changes it, this step fails and the site keeps the last good data.
      - name: Download Apple's egress IP list
        run: |
          new="$RUNNER_TEMP/ranges.csv"
          old=icloud-private-relay/ranges.csv

          # curl -f fails on HTTP errors, -sS hides the progress bar but
          # still shows errors, and -L follows redirects.
          curl -fsSL https://mask-api.icloud.com/egress-ip-ranges.csv -o "$new"

          # Every line must be blank or start with a CIDR and a two-letter
          # country code, e.g. "172.224.226.0/27,GB,". The page skips blank
          # lines, so they're fine. grep -E takes an extended regex, -v
          # picks lines that don't match it, and -c counts them. grep exits
          # with an error when the count is 0, hence `|| true`.
          bad_lines=$(grep -Evc '^([0-9a-fA-F:.]+/[0-9]{1,3},[A-Z]{2},|$)' "$new" || true)
          if [ "$bad_lines" -ne 0 ]; then
            echo "::error::$bad_lines lines don't look like ranges. First few:"
            grep -Ev '^([0-9a-fA-F:.]+/[0-9]{1,3},[A-Z]{2},|$)' "$new" | head -5
            exit 1
          fi

          # A list that suddenly shrinks by half is more likely broken than real.
          new_count=$(wc -l < "$new")
          old_count=$(wc -l < "$old")
          if [ "$new_count" -lt $((old_count / 2)) ]; then
            echo "::error::Only $new_count lines, down from $old_count."
            exit 1
          fi

          mv "$new" "$old"

      # Rewrite the refresh date when the list changed, and at least weekly
      # otherwise, so an old date means this workflow has stopped. The weekly
      # commit also keeps GitHub from turning off scheduled workflows in a
      # repository with no recent activity.
      - name: Record the refresh date
        run: |
          date_file=icloud-private-relay/ranges-updated.txt
          last=$(cat "$date_file" 2>/dev/null || echo 0000-00-00)
          week_ago=$(date -u -d '7 days ago' +%Y-%m-%d)

          # `git diff --quiet` fails when the file changed. `<` inside [[ ]]
          # compares text, which puts YYYY-MM-DD dates in order.
          if ! git diff --quiet -- icloud-private-relay/ranges.csv || [[ "$last" < "$week_ago" ]]; then
            date -u +%Y-%m-%d > "$date_file"
          fi

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icloud-private-relay/ranges.csv icloud-private-relay/ranges-updated.txt

          # `git diff --cached --quiet` fails when something is staged.
          git diff --cached --quiet || (git commit -m "Update iCloud Private Relay ranges" && git push)
