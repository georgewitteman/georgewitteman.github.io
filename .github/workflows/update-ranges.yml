name: Update ranges

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # A plain clone instead of actions/checkout, so there's no action
      # version to keep updated.
      - name: Clone the repository
        env:
          TOKEN: ${{ github.token }}
        run: git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .

      # Checks the download before replacing the old file. If Apple moves or
      # changes the file, this step fails (GitHub emails about failed runs)
      # and the site keeps the last good data instead of breaking silently.
      - name: Download Apple's egress IP list
        run: |
          new="$RUNNER_TEMP/ranges.csv"
          old=icloud-private-relay/ranges.csv
          curl -fsSL https://mask-api.icloud.com/egress-ip-ranges.csv -o "$new"

          # Every line must start with a CIDR and a two-letter country code,
          # e.g. "172.224.226.0/27,GB,".
          bad_lines=$(grep -Evc '^[0-9a-fA-F:.]+/[0-9]{1,3},[A-Z]{2},' "$new" || true)
          if [ "$bad_lines" -ne 0 ]; then
            echo "::error::$bad_lines lines don't look like ranges. First few:"
            grep -Ev '^[0-9a-fA-F:.]+/[0-9]{1,3},[A-Z]{2},' "$new" | head -5
            exit 1
          fi

          # A list that suddenly shrinks by half is more likely broken than real.
          new_count=$(wc -l < "$new")
          old_count=$(wc -l < "$old")
          if [ "$new_count" -lt $((old_count / 2)) ]; then
            echo "::error::Only $new_count lines, down from $old_count."
            exit 1
          fi

          mv "$new" "$old"

      # ranges-updated.txt holds the date of the last refresh, which the
      # page shows. It's rewritten when the list changes, and at least
      # weekly otherwise, so a date more than a week old means this workflow
      # has stopped. The weekly commit also counts as repository activity,
      # which keeps GitHub from turning off this scheduled workflow after
      # 60 days without any.
      - name: Record the refresh date
        run: |
          date_file=icloud-private-relay/ranges-updated.txt
          last=$(cat "$date_file" 2>/dev/null || echo 0000-00-00)
          week_ago=$(date -u -d '7 days ago' +%Y-%m-%d)
          if ! git diff --quiet -- icloud-private-relay/ranges.csv || [[ "$last" < "$week_ago" ]]; then
            date -u +%Y-%m-%d > "$date_file"
          fi

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icloud-private-relay/ranges.csv icloud-private-relay/ranges-updated.txt
          git diff --cached --quiet || (git commit -m "Update iCloud Private Relay ranges" && git push)
